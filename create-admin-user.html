<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Admin User</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #D80621;
      margin-top: 0;
    }
    button {
      background: #D80621;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-top: 20px;
    }
    button:hover {
      background: #B00520;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      display: none;
    }
    .success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .info {
      background: #e7f3ff;
      color: #004085;
      border: 1px solid #b8daff;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Create Admin User</h1>

    <div class="info">
      <strong>Admin Details:</strong><br>
      Email: ram@ncplconsulting.net<br>
      Password: NCPL@1234<br>
      Name: Ram Thottempudi
    </div>

    <button id="createBtn" onclick="createAdmin()">Create Admin Account</button>

    <div id="result" class="result"></div>
  </div>

  <script>
    async function createAdmin() {
      const btn = document.getElementById('createBtn');
      const result = document.getElementById('result');

      btn.disabled = true;
      btn.textContent = 'Creating...';
      result.style.display = 'none';

      try {
        const response = await fetch('https://nzhkbfggquwqmlxtsgts.supabase.co/functions/v1/create-admin', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56aGtiZmdncXV3cW1seHRzZ3RzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxNDQ1NzQsImV4cCI6MjA4NzcyMDU3NH0.1viTJbPmnEXveQfHd_ZXdAiFv9ECqQ_Mx0f6ZRizxyg'
          },
          body: JSON.stringify({
            email: 'ram@ncplconsulting.net',
            password: 'NCPL@1234',
            fullName: 'Ram Thottempudi',
            adminSecret: 'NCPL_ADMIN_SETUP_2024'
          })
        });

        const data = await response.json();

        if (data.success) {
          result.className = 'result success';
          result.textContent = 'Admin account created successfully! You can now login with the credentials above.';
          result.style.display = 'block';
          btn.textContent = 'Account Created ✓';
        } else {
          throw new Error(data.error || 'Unknown error');
        }
      } catch (error) {
        result.className = 'result error';
        result.textContent = 'Error: ' + error.message;
        result.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Retry';
      }
    }
  </script>
</body>
</html>
